<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="مكتب المحامي ريان الجهني">
  <!--
    Favicon.

    A 16px tile cannot carry the calligraphic letterform of the full mark —
    it would render as an unreadable smudge. So this reduces the identity to
    its other element: the gold arched window grid on ink, which stays legible
    at tab size and reads as the same brand.
  -->
  <rect width="64" height="64" rx="8" fill="#102E2A"/>

  <g fill="none" stroke="#B08D57" stroke-width="2.6" stroke-linecap="square">
    <!-- Pointed arch, matching the mark's window -->
    <path d="M18 52V30c0-8 6.3-14 14-14s14 6 14 14v22"/>
    <!-- Mullion and transoms: the document-grid motif -->
    <path d="M32 20v32"/>
    <path d="M19.6 34h24.8"/>
    <path d="M18 42h28"/>
  </g>
</svg>
